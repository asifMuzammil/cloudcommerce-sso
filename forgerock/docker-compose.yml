# ---------------------------------------------------------------------------
# ForgeRock (Ping) DS + AM on plain Docker Compose, using the public ForgeOps
# evaluation images. Run scripts/bootstrap.sh once before the first "up".
#
#   ds-idrepo  identities (users) + AM configuration store
#   ds-cts     Core Token Service: sessions / OAuth2 tokens (separate, like prod)
#   am         Access Manager: login trees, MFA, OAuth2/OIDC provider
#
# Only AM is published, and only on 127.0.0.1 (reach it via SSM port forwarding).
# ---------------------------------------------------------------------------
name: forgerock

x-ds: &ds
  image: us-docker.pkg.dev/forgeops-public/images/ds:8.1.2-latest
  restart: unless-stopped
  # In Kubernetes "init" runs in an init container and "start-ds" in the main
  # container. Here we run both, in order, in one container.
  entrypoint: ["sh", "-c", "./docker-entrypoint.sh init && exec ./docker-entrypoint.sh start-ds"]
  tmpfs:
    # init copies PEM keys here for start-ds (an emptyDir in Kubernetes)
    - /var/run/secrets/keys:mode=1777

services:
  ds-idrepo:
    <<: *ds
    hostname: ds-idrepo
    environment:
      POD_NAME: ds-idrepo-0          # selects runtime-scripts/ds-idrepo/setup
    volumes:
      - ./data/ds-idrepo:/opt/opendj/data
      - ./secrets/ds-ssl-keypair:/var/run/secrets/ds-ssl-keypair:ro
      - ./secrets/ds-master-keypair:/var/run/secrets/ds-master-keypair:ro
      - ./secrets/truststore:/var/run/secrets/truststore:ro
      - ./secrets/opendj-passwords:/var/run/secrets/opendj-passwords:ro
    # DS sizes its heap as 65% of the container limit. Without a limit it
    # would size itself from the whole host (16 GB).
    mem_limit: 1536m

  ds-cts:
    <<: *ds
    hostname: ds-cts
    environment:
      POD_NAME: ds-cts-0             # selects runtime-scripts/ds-cts/setup
    volumes:
      - ./data/ds-cts:/opt/opendj/data
      - ./secrets/ds-ssl-keypair:/var/run/secrets/ds-ssl-keypair:ro
      - ./secrets/ds-master-keypair:/var/run/secrets/ds-master-keypair:ro
      - ./secrets/truststore:/var/run/secrets/truststore:ro
      - ./secrets/opendj-passwords:/var/run/secrets/opendj-passwords:ro
    mem_limit: 1g

  am:
    image: us-docker.pkg.dev/forgeops-public/images/am:8.1.1-latest
    hostname: am
    restart: unless-stopped
    depends_on: [ds-idrepo, ds-cts]  # AM also waits for DS :8080/alive itself
    # 1) DEV ONLY: the ForgeOps config hard-codes "com.iplanet.am.cookie.secure=true"
    #    (it assumes HTTPS behind an ingress). Over plain http:// the browser drops the
    #    Secure session cookie and the XUI shows "Unauthorized access" even with the right
    #    password. Production keeps secure=true and puts AM behind HTTPS (ALB + ACM).
    # 2) On first boot AM rewrites boot.json to read its config-store password from the
    #    MAIN keystore (and writes that entry into keystore.jceks). On every start the
    #    entrypoint copies our original keystore.jceks back, so a second start fails with
    #    "Can't open boot keystore". ForgeOps never hits this because AM pods are
    #    disposable. We keep AM's config on a volume, so restore the pristine boot.json
    #    before each start.
    # 3) Trust our dev CA (for LDAPS to DS), then run the normal AM entrypoint.
    command:
      - bash
      - -c
      - >-
        B=/home/forgerock/openam/config/boot.json; P=/home/forgerock/openam/boot.json.pristine;
        { [ -f $$P ] || cp $$B $$P; } && cp $$P $$B &&
        sed -i 's/com.iplanet.am.cookie.secure=true/com.iplanet.am.cookie.secure=false/'
        /home/forgerock/openam/config/services/realm/root/iplanetamplatformservice/1.0/globalconfig/default/com-sun-identity-servers/server-default.json
        && /home/forgerock/import-pem-certs.sh
        && exec /home/forgerock/docker-entrypoint.sh
    environment:
      # Public URL of AM = what the browser uses. *.localtest.me resolves to 127.0.0.1,
      # which is exactly where SSM port forwarding lands on your laptop.
      FQDN: am.localtest.me
      AM_SERVER_PROTOCOL: http
      AM_SERVER_PORT: "8080"
      # From .env (generated by bootstrap.sh)
      AM_PASSWORDS_AMADMIN_CLEAR: ${AM_PASSWORDS_AMADMIN_CLEAR:?run scripts/bootstrap.sh}
      AM_ENCRYPTION_KEY: ${AM_ENCRYPTION_KEY:?run scripts/bootstrap.sh}
      AM_AUTHENTICATION_SHARED_SECRET: ${AM_AUTHENTICATION_SHARED_SECRET:?run scripts/bootstrap.sh}
      AM_OIDC_CLIENT_SUBJECT_IDENTIFIER_HASH_SALT: ${AM_OIDC_CLIENT_SUBJECT_IDENTIFIER_HASH_SALT:?run scripts/bootstrap.sh}
      # Where AM finds DS (LDAPS)
      AM_STORES_USER_SERVERS: ds-idrepo:1636
      AM_STORES_CTS_SERVERS: ds-cts:1636
      AM_STORES_SSL_ENABLED: "true"
      # Truststore built at startup by import-pem-certs.sh
      AM_PEM_TRUSTSTORE: /var/run/secrets/truststore/ca.crt
      TRUSTSTORE_PATH: /home/forgerock/amtruststore
      TRUSTSTORE_PASSWORD: changeit
    volumes:
      - ./secrets/am:/var/run/secrets/am:ro
      - ./secrets/amster:/var/run/secrets/amster:ro
      - ./secrets/truststore:/var/run/secrets/truststore:ro
      # AM's file-based config lives here: console changes survive restarts
      - am-openam:/home/forgerock/openam
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 3g

volumes:
  am-openam:
